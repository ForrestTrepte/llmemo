# Ruff settings for all Python in the repo: the package in python/ and the spec tools.
line-length = 100
target-version = "py312"

[lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "TID",     # tidy imports
]
# ruff format keeps code within line-length. What's left over is long strings, such as the
# vector descriptions, which are clearer unwrapped.
ignore = ["E501"]
# Used on purpose in prose, e.g. "256 × é".
allowed-confusables = ["×"]
